[project]
name = "clawbridge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "thilak15", email = "thilakreddy125@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "authlib>=1.9.1",
    "cryptography>=50.0.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["preflight", ".venv"]
